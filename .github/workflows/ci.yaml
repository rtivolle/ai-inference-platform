name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check control-plane/ loader/ tests/ scripts/deploy_clusters.py scripts/install_litellm.py

      - name: Run Mypy Type Check
        run: |
          mypy --ignore-missing-imports control-plane/ loader/ scripts/deploy_clusters.py scripts/install_litellm.py

  contracts-and-scripts:
    name: Shellcheck & Contracts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml shellcheck-py

      - name: Run shellcheck on scripts
        run: |
          shellcheck scripts/*.sh

      - name: Validate JSON schemas
        run: |
          python -c "import jsonschema, json; [jsonschema.Draft202012Validator.check_schema(json.load(open(f))) for f in ['contracts/model_spec.schema.json', 'contracts/dynamo_crd.schema.json']]"

  unit-and-e2e-tests:
    name: Pytest Unit & E2E Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          CONTROL_PLANE_MOCK=1 pytest -v tests/

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Control Plane Docker image
        run: |
          docker build -t ai-inference-control-plane:test -f control-plane/Dockerfile .

      - name: Build Loader Docker image
        run: |
          docker build -t ai-inference-loader:test -f loader/Dockerfile loader/
