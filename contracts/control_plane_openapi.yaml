openapi: 3.1.0
info:
  title: AI Inference Control Plane API
  description: Automated VRAM sizing, NVIDIA Dynamo disaggregated workload management,
    and LiteLLM gateway synchronization.
  version: 1.0.0
paths:
  /auth/config:
    get:
      tags:
      - Authentication
      summary: Authentication Config
      operationId: authentication_config_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/session:
    get:
      tags:
      - Authentication
      summary: Current Session
      operationId: current_session_auth_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - AdministratorSession: []
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - BearerAuth: []
      - AdministratorSession: []
  /api/v1/data/events:
    post:
      tags:
      - Data
      summary: Capture Event
      operationId: capture_event_api_v1_data_events_post
      security:
      - CaptureToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureEvent'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Data
      summary: List Events
      operationId: list_events_api_v1_data_events_get
      security:
      - BearerAuth: []
      - AdministratorSession: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/data/examples:
