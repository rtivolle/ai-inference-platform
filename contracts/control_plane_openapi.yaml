openapi: 3.1.0
info:
  title: AI Inference Control Plane API
  version: 1.0.0
  description: Control plane REST API for auto-tuning, provisioning NVIDIA Dynamo workloads, and synchronizing with LiteLLM Proxy.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    CloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
paths:
  /api/v1/models/deploy:
    post:
      summary: Deploy or auto-tune and schedule a model on the cluster
      operationId: deployModel
      security:
        - BearerAuth: []
        - CloudflareAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model_id
              properties:
                model_id:
                  type: string
                  example: "meta-llama/Llama-3.3-70B-Instruct"
                deployment_name:
                  type: string
                  example: "llama-3-3-70b-instruct"
                profile:
                  type: string
                  enum: [low-latency, high-throughput, balanced]
                  default: balanced
                dtype:
                  type: string
                  enum: [auto, bfloat16, float16, bf16, fp16]
                  default: auto
                quantization:
                  type: string
                  enum: [fp8, awq, gptq]
                max_model_len:
                  type: integer
                  default: 32768
                gpu_memory_utilization:
                  type: number
                  default: 0.90
                target_concurrency:
                  type: integer
                  default: 16
      responses:
        '200':
          description: Model deployment plan computed and deployment accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "provisioning"
                  deployment_name:
                    type: string
                  model_id:
                    type: string
                  plan:
                    type: object
        '401':
          description: Unauthorized request (missing or invalid Bearer token or Cloudflare Access headers)
        '404':
          description: Requested model could not be found or inspected
        '409':
          description: Insufficient GPU/VRAM capacity on cluster
        '400':
          description: Invalid request parameters

  /api/v1/models/{model_name}:
    delete:
      summary: Gracefully delete a model deployment (LiteLLM deregistration + dynamic drain + K8s cleanup)
      operationId: deleteModel
      security:
        - BearerAuth: []
        - CloudflareAccess: []
      parameters:
        - name: model_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model deletion initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleting"
                  model_name:
                    type: string
        '401':
          description: Unauthorized request
        '404':
          description: Model deployment not found

  /api/v1/models:
    get:
      summary: List all managed model deployments
      operationId: listModels
      security:
        - BearerAuth: []
        - CloudflareAccess: []
      responses:
        '200':
          description: Active deployments list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          description: Unauthorized request

  /api/v1/models/{model_name}/status:
    get:
      summary: Get live status of model deployment and endpoint readiness
      operationId: getModelStatus
      security:
        - BearerAuth: []
        - CloudflareAccess: []
      parameters:
        - name: model_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  ready:
                    type: boolean
        '401':
          description: Unauthorized request
        '404':
          description: Model deployment not found

  /api/v1/cluster/gpus:
    get:
      summary: Get cluster GPU inventory and allocatable availability
      operationId: getClusterGpus
      security:
        - BearerAuth: []
        - CloudflareAccess: []
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes_count:
                    type: integer
                  gpu_pools:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized request

  /health:
    get:
      summary: Liveness health probe (unauthenticated)
      operationId: health
      responses:
        '200':
          description: OK

  /health/readiness:
    get:
      summary: Readiness probe checking K8s and LiteLLM connectivity (unauthenticated)
      operationId: healthReadiness
      responses:
        '200':
          description: Ready
