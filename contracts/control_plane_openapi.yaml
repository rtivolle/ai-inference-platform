components:
  schemas:
    CaptureEvent:
      properties:
        request_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]*$
          title: Request Id
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        model:
          type: string
          maxLength: 256
          minLength: 1
          title: Model
        model_revision:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Model Revision
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        outcome:
          type: string
          enum:
          - success
          - failure
          - incomplete
          title: Outcome
        latency_ms:
          type: number
          maximum: 86400000.0
          minimum: 0.0
          title: Latency Ms
        input_tokens:
          type: integer
          minimum: 0.0
          title: Input Tokens
          default: 0
        output_tokens:
          type: integer
          minimum: 0.0
          title: Output Tokens
          default: 0
        consent:
          type: boolean
          title: Consent
          default: false
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          maxItems: 64
          title: Messages
      additionalProperties: false
      type: object
      required:
      - request_id
      - conversation_id
      - model
      - occurred_at
      - outcome
      - latency_ms
      title: CaptureEvent
    DatasetRequest:
      properties:
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        event_ids:
          items:
            type: string
          type: array
          maxItems: 10000
          minItems: 1
          title: Event Ids
        seed:
          type: string
          maxLength: 128
          minLength: 1
          title: Seed
          default: v1
        validation_fraction:
          type: number
          exclusiveMaximum: 0.5
          exclusiveMinimum: 0.0
          title: Validation Fraction
          default: 0.1
        test_fraction:
          type: number
          exclusiveMaximum: 0.5
          exclusiveMinimum: 0.0
          title: Test Fraction
          default: 0.1
      additionalProperties: false
      type: object
      required:
      - name
      - event_ids
      title: DatasetRequest
    DeployRequest:
      properties:
        model_id:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^\S+$
          title: Model Id
        model_revision:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{40}$
          - type: 'null'
          title: Model Revision
        deployment_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Deployment Name
        profile:
          type: string
          enum:
          - low-latency
          - high-throughput
          - balanced
          title: Profile
          default: balanced
        dtype:
          type: string
          enum:
          - auto
          - bfloat16
          - float16
          - bf16
          - fp16
          title: Dtype
          default: auto
        quantization:
          anyOf:
          - type: string
            enum:
            - fp8
            - awq
            - gptq
          - type: 'null'
          title: Quantization
        max_model_len:
          type: integer
          maximum: 131072
          minimum: 512
          title: Max Model Len
          default: 32768
        gpu_memory_utilization:
          type: number
          maximum: 0.98
          minimum: 0.5
          title: Gpu Memory Utilization
          default: 0.9
        target_concurrency:
          type: integer
          exclusiveMinimum: 0.0
          title: Target Concurrency
          default: 16
      type: object
      required:
      - model_id
      title: DeployRequest
    EvictionRequest:
      properties:
        uid:
          type: string
          maxLength: 128
          minLength: 1
          title: Uid
      type: object
      required:
      - uid
      title: EvictionRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 128
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Password
          writeOnly: true
      type: object
      required:
      - username
      - password
      title: LoginRequest
    Message:
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 16384
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: Message
    PromotionRequest:
      properties:
        deployment_name:
          type: string
          pattern: ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$
          title: Deployment Name
        max_model_len:
          type: integer
          maximum: 4096.0
          minimum: 128.0
          title: Max Model Len
          default: 1024
      additionalProperties: false
      type: object
      required:
      - deployment_name
      title: PromotionRequest
    ReviewRequest:
      properties:
        status:
          type: string
          enum:
          - approved
          - rejected
          title: Status
        corrected_response:
          anyOf:
          - type: string
            maxLength: 16384
            minLength: 1
          - type: 'null'
          title: Corrected Response
        note:
          type: string
          maxLength: 2000
          title: Note
          default: ''
      additionalProperties: false
      type: object
      required:
      - status
      title: ReviewRequest
    ScaleRequest:
      properties:
        replicas:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Replicas
        resource_version:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Resource Version
      type: object
      required:
      - replicas
      title: ScaleRequest
    TrainingRequest:
      properties:
        dataset_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Dataset Id
        base_model:
          type: string
          const: Qwen/Qwen2.5-0.5B-Instruct
          title: Base Model
          default: Qwen/Qwen2.5-0.5B-Instruct
        base_revision:
          type: string
          pattern: ^[a-f0-9]{40}$
          title: Base Revision
        output_model_id:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          title: Output Model Id
        epochs:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Epochs
          default: 1
        learning_rate:
          type: number
          maximum: 0.01
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 0.0002
        max_length:
          type: integer
          maximum: 4096.0
          minimum: 128.0
          title: Max Length
          default: 1024
        lora_rank:
          type: integer
          maximum: 64.0
          minimum: 4.0
          title: Lora Rank
          default: 16
        seed:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          default: 42
      additionalProperties: false
      type: object
      required:
      - dataset_id
      - base_revision
      - output_model_id
      title: TrainingRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    AdministratorSession:
      type: apiKey
      in: cookie
      name: inference_session
      description: Administrator session from /auth/login. Mutations also require
        X-CSRF-Token from the login/session response.
    CaptureToken:
      type: http
      scheme: bearer
      description: Dedicated DATA_CAPTURE_TOKEN; grants capture-only access.
