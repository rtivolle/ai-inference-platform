# NVIDIA Dynamo Platform Helm Values
# Configures Dynamo CRD operator, Grove (PodCliqueSet) controller, and KAI Scheduler
global:
  imagePullPolicy: IfNotPresent
  sharedStoragePath: /mnt/nvme/model-cache

dynamoOperator:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

groveController:
  enabled: true
  leaderElection: true
  syncPeriod: 10s
  enableDisaggregatedServing: true

kaiScheduler:
  enabled: true
  topologyAware: true
  nvlinkAware: true
  rdmaAware: true

kvTransfer:
  defaultProtocol: rdma
  engine: nixl
  enableGdr: true # GPUDirect RDMA
