apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: cloudflare
type: Opaque
stringData:
  # Token for the remotely managed ai-inference-platform tunnel.
  tunnel-token: "REPLACE_WITH_CLOUDFLARE_TUNNEL_TOKEN"
  # API Token for ExternalDNS
  cloudflare-api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
