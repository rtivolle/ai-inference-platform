apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: cloudflare
type: Opaque
stringData:
  # Credentials json placeholder for cloudflared tunnel
  credentials.json: |
    {
      "AccountTag": "REPLACE_WITH_CLOUDFLARE_ACCOUNT_TAG",
      "TunnelSecret": "REPLACE_WITH_CLOUDFLARE_TUNNEL_SECRET",
      "TunnelID": "REPLACE_WITH_CLOUDFLARE_TUNNEL_ID"
    }
  # API Token for ExternalDNS
  cloudflare-api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
