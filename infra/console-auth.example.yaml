  namespace: dynamo-control-plane
type: Opaque
stringData:
  CONTROL_PLANE_ADMIN_USERNAME: "admin"
  CONTROL_PLANE_ADMIN_PASSWORD_HASH: ""
  PROMETHEUS_BEARER_TOKEN: ""
