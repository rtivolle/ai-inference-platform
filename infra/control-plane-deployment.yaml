apiVersion: v1
kind: Namespace
metadata:
  name: dynamo-control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: dynamo-control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      containers:
        - name: control-plane
          image: ai-inference-control-plane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LITELLM_PROXY_URL
              value: "http://litellm-service.ai-gateway.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              value: "sk-internal-litellm-master-key"
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-service
  namespace: dynamo-control-plane
  labels:
    app.kubernetes.io/name: control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 8000
      targetPort: 8000
