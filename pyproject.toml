[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference-platform"
version = "1.0.0"
description = "Kubernetes AI Inference Platform with NVIDIA Dynamo, LiteLLM, and Cloudflare"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "kubernetes_asyncio>=31.0.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "huggingface_hub>=0.25.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[tool.setuptools.package-dir]
autotuner = "control-plane/autotuner"
api = "control-plane/api"

[tool.setuptools.packages.find]
where = ["control-plane"]

[tool.setuptools.package-data]
api = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "e2e_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["B008", "E501"]
